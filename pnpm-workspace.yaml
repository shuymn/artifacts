packages:
  - packages/*

catalog:
  "@cloudflare/vitest-plugin": 1.8.1
  "@cloudflare/workers-oauth-provider": 1.2.4
  "@cloudflare/workers-types": 5.20261112.1
  "@modelcontextprotocol/client": 2.4.0
  "@modelcontextprotocol/server": 2.4.0
  "@playwright/test": 1.65.1
  "@types/node": 24.19.2
  client-zip: 2.5.1
  jose: 6.2.17
  jsonc-parser: 3.3.1
  mime: 4.1.2
  oauth4webapi: 3.8.8
  typescript: 7.0.2
  vitest: 5.1.0
  wrangler: 4.161.0
  zod: 4.6.7

# Wait three days (in minutes), matching the minimumReleaseAge of the shared Renovate preset.
minimumReleaseAge: 4320

# The platform binaries come from optionalDependencies, so the install scripts are not needed.
allowBuilds:
  esbuild: false
  lefthook: false
  workerd: false

# Fail installs when an unreviewed dependency build script appears.
strictDepBuilds: true

# Block git/tarball URL sources in transitive dependencies.
blockExoticSubdeps: true

# Detect package trust/provenance downgrades.
trustPolicy: no-downgrade
