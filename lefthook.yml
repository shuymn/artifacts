pre-commit:
  commands:
    # Runs first, so that the secret scan below reads the staged design files without Pencil's fileToken. It rewrites
    # the staged copies only; the working files keep the member.
    pen-file-token:
      glob: "*.pen"
      run: mise exec -- node scripts/strip-pen-file-token.mjs {staged_files}
      priority: 1
    oxfmt:
      run: pnpm exec oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    oxlint:
      glob: "*.{js,mjs,cjs,jsx,ts,mts,cts,tsx}"
      run: pnpm exec oxlint --type-aware --deny-warnings {staged_files}
    actionlint:
      glob: ".github/workflows/*.{yml,yaml}"
      run: mise exec -- actionlint {staged_files}
    ghalint:
      glob: ".github/workflows/*.{yml,yaml}"
      run: mise exec -- ghalint run
    betterleaks:
      run: mise exec -- betterleaks git --pre-commit --staged --redact --no-banner --verbose --validation=false

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}
