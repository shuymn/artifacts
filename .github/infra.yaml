apiVersion: gh-infra/v1
kind: Repository
metadata:
  name: artifacts
  owner: shuymn
reconcile:
  labels: authoritative
  rulesets: authoritative
spec:
  description: A personal artifact host on Cloudflare Workers that any AI agent can publish to over MCP, REST or a CLI
  visibility: public
  archived: false
  topics:
    - ai-agents
    - artifacts
    - cloudflare-workers
    - mcp
    - typescript
  labels:
    - name: dependencies
      color: ededed
    # release-please finds its open and merged release PRs by these labels.
    - name: "autorelease: pending"
      color: ededed
    - name: "autorelease: tagged"
      color: ededed
  features:
    issues: true
    projects: false
    wiki: false
    discussions: false
    pull_requests: true
  merge_strategy:
    allow_merge_commit: true
    allow_squash_merge: false
    allow_rebase_merge: false
    allow_auto_merge: true
    auto_delete_head_branches: true
    squash_merge_commit_title: COMMIT_OR_PR_TITLE
    squash_merge_commit_message: COMMIT_MESSAGES
    merge_commit_title: MERGE_MESSAGE
    merge_commit_message: PR_TITLE
  release_immutability: true
  security:
    vulnerability_alerts: true
    automated_security_fixes: true
    private_vulnerability_reporting: false
  rulesets:
    - name: default
      target: branch
      enforcement: active
      conditions:
        ref_name:
          include:
            - ~DEFAULT_BRANCH
      rules:
        non_fast_forward: true
        deletion: true
        creation: false
        required_linear_history: false
        required_signatures: true
    - name: pull-request-gate
      target: branch
      enforcement: active
      bypass_actors:
        - role: admin
          bypass_mode: always
      conditions:
        ref_name:
          include:
            - ~DEFAULT_BRANCH
      rules:
        pull_request:
          required_approving_review_count: 0
          dismiss_stale_reviews_on_push: false
          require_code_owner_review: false
          require_last_push_approval: false
          required_review_thread_resolution: true
        required_status_checks:
          strict_required_status_checks_policy: true
          contexts:
            - context: Check
              app: github-actions
            - context: security / betterleaks
              app: github-actions
    # A push to `release` deploys (docs/operations.md), so only the repository's GitHub App, which the release workflow
    # runs as, may create, move or delete it.
    - name: release
      target: branch
      enforcement: active
      bypass_actors:
        - app: id:5775579
          bypass_mode: always
      conditions:
        ref_name:
          include:
            - refs/heads/release
      rules:
        creation: true
        update: true
        deletion: true
        non_fast_forward: true
  actions:
    enabled: true
    allowed_actions: selected
    sha_pinning_required: true
    workflow_permissions: read
    can_approve_pull_requests: false
    selected_actions:
      github_owned_allowed: false
      verified_allowed: false
      patterns_allowed:
        - actions/cache@*
        - actions/checkout@*
        - actions/create-github-app-token@*
        - googleapis/release-please-action@*
        - jdx/mise-action@*
        - oven-sh/setup-bun@*
        - shuymn/github-actions/.github/workflows/gha.yml@*
        - shuymn/github-actions/.github/workflows/renovate.yml@*
        - shuymn/github-actions/.github/workflows/security.yml@*
    fork_pr_approval: first_time_contributors
